name: Build OpenEar packs

# Downloads an OpenEar specimen from Zenodo on GitHub's runner, converts it into a small
# data pack, commits the pack to data/, then rebuilds and deploys the site.
on:
  workflow_dispatch:
    inputs:
      specimen:
        description: "Specimen: alpha, beta, gamma, delta, epsilon, zeta, eta, theta, or all"
        default: "delta"
        required: true
      spacing:
        description: "Voxel size of the pack in mm. 0.15 keeps nearly all of the 0.125 mm CBCT detail (~30 MB per ear); 0.2 is ~13 MB; 0.125 is native (~55 MB)"
        default: "0.15"
        required: true
      full_download:
        description: "Download the whole archive instead of using range requests (slower, needs disk)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: openear-data
  cancel-in-progress: false

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter dependencies
        run: pip install numpy SimpleITK trimesh fast-simplification requests
      - name: Probe Zenodo and list the archive
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Zenodo probe"
            echo '```'
            python3 - <<'PY' 2>&1 | tail -40
          import requests, json
          r = requests.get("https://zenodo.org/api/records/1473724", timeout=60)
          print("api status", r.status_code)
          j = r.json()
          for f in j.get("files", []):
              print(f.get("key"), f.get("size"), (f.get("links") or {}).get("self"))
          PY
            echo '```'
            echo "## Archive listing (${{ inputs.specimen }})"
            echo '```'
            python3 tools/fetch_openear.py --specimen "${{ inputs.specimen }}" --list --work work 2>&1 | tail -60
            echo '```'
          } | tee probe.md
          cat probe.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch and convert ${{ inputs.specimen }}
        id: convert
        run: |
          set -o pipefail
          python3 tools/fetch_openear.py --specimen "${{ inputs.specimen }}" --spacing "${{ inputs.spacing }}" --out data --work work ${{ inputs.full_download && '--full' || '' }} 2>&1 | tee convert.log
          ls -la data
      - name: Report (always)
        if: always()
        run: |
          {
            echo "## Conversion log (last 120 lines)"
            echo '```'
            tail -120 convert.log 2>/dev/null || echo "(no convert.log: the step did not start)"
            echo '```'
            echo "## Work folder"
            echo '```'
            find work -maxdepth 4 -type d 2>/dev/null | head -50
            du -sh work 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openear-logs-${{ inputs.specimen }}
          path: |
            probe.md
            convert.log
          if-no-files-found: ignore
      - name: Commit packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Add OpenEar pack(s): ${{ inputs.specimen }} at ${{ inputs.spacing }} mm" || echo "nothing to commit"
          git push
      - name: Upload pack as workflow artifact (also downloadable from this run)
        uses: actions/upload-artifact@v4
        with:
          name: openear-packs
          path: |
            data/*.tba
            data/datasets.json

  deploy-site:
    needs: build-pack
    uses: ./.github/workflows/pages.yml
    secrets: inherit
