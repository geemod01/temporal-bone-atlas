name: Build OpenEar packs

# Downloads an OpenEar specimen from Zenodo on GitHub's runner, converts it into a small
# data pack, commits the pack to data/, then rebuilds and deploys the site.
on:
  workflow_dispatch:
    inputs:
      specimen:
        description: "Specimen: alpha, beta, gamma, delta, epsilon, zeta, eta, theta, or all"
        default: "delta"
        required: true
      spacing:
        description: "Voxel size of the pack in mm. 0.15 keeps nearly all of the 0.125 mm CBCT detail (~30 MB per ear); 0.2 is ~13 MB; 0.125 is native (~55 MB)"
        default: "0.15"
        required: true
      full_download:
        description: "Download the whole archive instead of using range requests (slower, needs disk)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: openear-${{ inputs.specimen }}
  cancel-in-progress: false

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter dependencies
        run: pip install numpy SimpleITK trimesh fast-simplification requests
      - name: Probe Zenodo and list the archive
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Zenodo probe"
            echo '```'
            python3 - <<'PY' 2>&1 | tail -40
          import requests, json
          r = requests.get("https://zenodo.org/api/records/1473724", timeout=60)
          print("api status", r.status_code)
          j = r.json()
          for f in j.get("files", []):
              print(f.get("key"), f.get("size"), (f.get("links") or {}).get("self"))
          PY
            echo '```'
            echo "## Archive listing (${{ inputs.specimen }})"
            echo '```'
            python3 tools/fetch_openear.py --specimen "${{ inputs.specimen }}" --list --work work 2>&1 | tail -60
            echo '```'
          } | tee probe.md
          cat probe.md >> "$GITHUB_STEP_SUMMARY"
          df -h / | tail -1 >> probe.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(printf 'Probe for run %s (%s)\n\n' "${{ github.run_id }}" "${{ inputs.specimen }}"; head -c 50000 probe.md)" >/dev/null && echo "probe comment posted" || echo "probe comment failed"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fetch and convert ${{ inputs.specimen }}
        id: convert
        shell: bash
        run: |
          python3 -u tools/fetch_openear.py --specimen "${{ inputs.specimen }}" --spacing "${{ inputs.spacing }}" --out data --work work ${{ inputs.full_download && '--full' || '' }} > convert.log 2>&1
          status=$?
          tail -80 convert.log
          ls -la data || true
          exit $status
      - name: Post log as commit comment (readable without the Actions UI)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "OpenEar run ${{ github.run_id }} (${{ inputs.specimen }} @ ${{ inputs.spacing }} mm): job ${{ job.status }}"
            echo
            echo '```'
            cat probe.md 2>/dev/null | tail -60
            echo '--- convert.log (tail) ---'
            tail -150 convert.log 2>/dev/null || echo "(no convert.log)"
            echo '```'
          } > comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(head -c 60000 comment.md)" >/dev/null && echo "comment posted" || echo "comment failed"
      - name: Report (always)
        if: always()
        run: |
          {
            echo "## Conversion log (last 120 lines)"
            echo '```'
            tail -120 convert.log 2>/dev/null || echo "(no convert.log: the step did not start)"
            echo '```'
            echo "## Work folder"
            echo '```'
            find work -maxdepth 4 -type d 2>/dev/null | head -50
            du -sh work 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openear-logs-${{ inputs.specimen }}
          path: |
            probe.md
            convert.log
          if-no-files-found: ignore
      - name: Publish pack to the "data" release and update datasets.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view data --repo ${{ github.repository }} >/dev/null 2>&1 || gh release create data --repo ${{ github.repository }} --title "Data packs" --notes "Temporal bone data packs (.tba) served to the atlas. OpenEar packs: Sieber D et al., Sci Data 2019, CC BY 4.0 (Zenodo 1473724)."
          for f in data/*.tba; do
            gh release upload data "$f" --repo ${{ github.repository }} --clobber
            echo "uploaded $f"
          done
          # rewrite datasets.json so each entry's file is the release download URL
          python3 - <<'PY'
          import json, os
          repo = os.environ.get("GITHUB_REPOSITORY", "${{ github.repository }}")
          p = "data/datasets.json"
          lib = json.load(open(p))
          for d in lib["datasets"]:
              name = os.path.basename(d["file"])
              d["file"] = "https://github.com/%s/releases/download/data/%s" % (repo, name)
          json.dump(lib, open(p, "w"), indent=1)
          print(open(p).read())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/datasets.json
          git commit -m "Register OpenEar pack(s): ${{ inputs.specimen }} at ${{ inputs.spacing }} mm" || echo "nothing to commit"
          git push
      - name: Upload pack as workflow artifact (also downloadable from this run)
        uses: actions/upload-artifact@v4
        with:
          name: openear-packs
          path: |
            data/*.tba
            data/datasets.json

  deploy-site:
    needs: build-pack
    uses: ./.github/workflows/pages.yml
    secrets: inherit
