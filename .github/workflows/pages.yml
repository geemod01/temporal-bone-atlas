name: Build and deploy the site

# Builds the single-file app (with the synthetic phantom embedded), places it next to the
# data packs in site/, and publishes site/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install numpy scipy scikit-image nibabel fast-simplification
      - name: Generate the phantom pack
        run: python3 tools/make_phantom.py
      - name: Build the app and assemble site/
        run: python3 build.py --site
      - name: Configure Pages (enables it on first run when permissions allow)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
